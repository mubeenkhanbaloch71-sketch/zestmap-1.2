<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <p class="tag">CONTACT</p>
  <h1 class="title">Get in Touch</h1>

  <div class="row">

    <!-- Left Box -->
    <div class="card">
      <h2 class="card-title">Suggest a Restaurant</h2>
      <p class="card-text">
        Know a hidden gem in Bahawalpur? Tell us and we'll verify and add it within 48 hours.
      </p>

      <input class="input" type="text" placeholder="Restaurant name">
      <input class="input" type="text" placeholder="Location / area">
      <input class="input" type="text" placeholder="Why you recommend it">

      <button class="btn">Suggest Now</button>

      <p class="footer-text">20+ restaurants suggested by users this month</p>
    </div>

    <!-- Right Box -->
    <div class="card">
      <h2 class="card-title">Contact Us</h2>
      <p class="card-text">
        Have a question or want to partner with ZestMap? We reply within 24 hours.
      </p>

      <input class="input" type="text" placeholder="Your Name">
      <input class="input" type="email" placeholder="Email address">

      <select class="input">
        <option>General Enquiry</option>
      </select>

      <textarea class="textarea" placeholder="Your message"></textarea>

      <button class="btn">Send Message</button>
    </div>

  </div>

</div>

</body>
</html>
